        // Supabase Cloud Saver using .maybeSingle()
        async function saveProgressToSupabase(lessonNum) {
            if (typeof supabaseClient === 'undefined') return;

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                alert("Please log in so your progress can be saved.");
                window.location.href = "../login.html";
                return;
            }

            const userId = session.user.id;

            let { data: currentData } = await supabaseClient
                .from('user_progress')
                .select('completed_lessons')
                .eq('user_id', userId)
                .maybeSingle();

            let lessons = currentData && currentData.completed_lessons ? currentData.completed_lessons : [];

            for (let i = 1; i <= lessonNum; i++) {
                let lId = `lesson-${i}`;
                if (!lessons.includes(lId)) {
                    lessons.push(lId);
                }
            }

            const { error } = await supabaseClient
                .from('user_progress')
                .upsert(
                    { user_id: userId, completed_lessons: lessons, updated_at: new Date() },
                    { onConflict: 'user_id' }
                );

            if (error) {
                console.error("Cloud Save Error:", error.message);
            } else {
                console.log("Progress successfully synced to Supabase!");
            }
        }

        // Reset Quiz Session for Retry
        window.resetQuizSession = function() {
            document.querySelectorAll('input[type="radio"]').forEach(input => {
                input.checked = false;

            });

            const resultDiv = document.getElementById('quiz-result');
            if (resultDiv) resultDiv.style.display = 'none';

            const submitBtn = document.getElementById("submit-quiz-btn");
            if (submitBtn) submitBtn.style.display = 'inline-block';

            selectedQuestions = shuffleArray(currentQuiz.questionsPool).slice(0, 4);
            const container = document.getElementById('questions-container');
            if(container) {
                let html = "";
                selectedQuestions.forEach((item, index) => {
                    html += `<div style="margin-bottom: 20px; background: #0f172a; padding: 20px; border-radius: 12px; border: 1px solid #334155;">`;
                    html += `<p style="color: #fff; font-weight: 600; margin-top: 0;">${index + 1}. ${item.q}</p>`;
                    item.options.forEach((opt, optIndex) => {
                        html += `<label style="display: block; color: #cbd5e1; margin: 8px 0; cursor: pointer;"><input type="radio" name="q${index}" value="${optIndex}"> ${opt}</label>`;
                    });
                    html += `</div>`;
                });
                container.innerHTML = html;
            }
        };

                    { q: "What signed document confirms that cargo arrived safely at its destination without damage?", options: ["Bill of Lading (BOL) or Proof of Delivery (POD)", "Rate Confirmation", "MC Authority Letter"], correct: 0 },
                    { q: "How do factoring companies operate for motor carriers?", options: ["They buy invoices and pay carriers instantly minus a small fee, collecting from the broker later", "They provide free fuel cards and truck repairs", "They act as freight brokers matching loads"], correct: 0 },
                    { q: "What is the typical independent dispatcher commission percentage based on gross revenue?", options: ["1% to 2%", "5% to 10%", "40% to 50%"], correct: 1 },
                    { q: "When do standard brokers usually pay carriers directly if they are not using a factoring service?", options: ["Instantly upon pickup", "Net 30 days after invoice submission", "At the end of the calendar year"], correct: 1 },
                    { q: "What constitutes a complete invoice packet submitted for payment collection?", options: ["Carrier Invoice, Signed BOL/POD, and Signed Rate Confirmation", "Only a verbal phone call", "Driver's License copy only"], correct: 0 },
                    { q: "What is 'recourse' factoring?", options: ["Factoring where the carrier must buy back the invoice if the broker fails to pay", "Factoring with zero fees", "Government subsidized factoring"], correct: 0 },
                    { q: "What is 'non-recourse' factoring?", options: ["Factoring where the factoring company absorbs credit loss if broker goes bankrupt", "Factoring for illegal loads", "Factoring paid in cash"], correct: 0 },
                    { q: "Why do carriers prefer factoring over waiting for Net 30 payment terms?", options: ["To maintain immediate cash flow for fuel, payroll, and maintenance costs", "To avoid paying taxes", "Brokers require it by law"], correct: 0 },
                    { q: "How does an independent dispatcher bill their carrier for completed work?", options: ["Invoicing weekly or bi-weekly based on calculated percentage of booked gross loads", "Charging $100 per mile", "Taking ownership of the truck"], correct: 0 },
                    { q: "What should be done if a customer reports damaged cargo on the POD?", options: ["Notify insurance immediately and submit cargo claims documentation", "Ignore the signature and request payment", "Delete the Rate Con"], correct: 0 },
                    { q: "What is a 'Quick Pay' option offered by some freight brokers?", options: ["Early invoice payout (usually 1-3 days) in exchange for a 2%-5% fee", "Paying in physical cash at delivery", "Paying before cargo is picked up"], correct: 0 },
                    { q: "What is the final step in the complete dispatch workflow lifecycle?", options: ["Collecting dispatcher commission fee and closing out load record", "Posting the truck on DAT", "Signing the initial carrier packet"], correct: 0 }
                ]
            }
        };

        // Fisher-Yates Shuffle
        function shuffleArray(array) {
            let shuffled = array.slice();
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // Parse query parameter for current lesson
        const urlParams = new URLSearchParams(window.location.search);
        const lessonId = urlParams.get('lesson') || "1";
        const currentQuiz = quizData[lessonId] || quizData["1"];
        const numericLessonNum = parseInt(lessonId);

        let selectedQuestions = [];

        // Load Quiz Content & Dynamic Retake Lesson Link
        document.addEventListener("DOMContentLoaded", () => {
            if(document.getElementById('quiz-badge')) document.getElementById('quiz-badge').innerText = currentQuiz.badge;
            if(document.getElementById('quiz-title')) document.getElementById('quiz-title').innerText = currentQuiz.title;

            // Dynamically point the persistent Retake Lesson button to the current lesson ID
         const retakeLessonBtn = document.getElementById('persistent-retake-lesson');
            if(retakeLessonBtn) {
                retakeLessonBtn.href = `lesson-${numericLessonNum}.html`;
            }

            selectedQuestions = shuffleArray(currentQuiz.questionsPool).slice(0, 4);

            const container = document.getElementById('questions-container');
            if(container) {
                let html = "";
                selectedQuestions.forEach((item, index) => {
                    html += `<div style="margin-bottom: 20px; background: #0f172a; padding: 20px; border-radius: 12px; border: 1px solid #334155;">`;
                    html += `<p style="color: #fff; font-weight: 600; margin-top: 0;">${index + 1}. ${item.q}</p>`;
                    item.options.forEach((opt, optIndex) => {
                        html += `<label style="display: block; color: #cbd5e1; margin: 8px 0; cursor: pointer;"><input type="radio" name="q${index}" value="${optIndex}"> ${opt}</label>`;
                    });
                    html += `</div>`;
                });
                container.innerHTML = html;
            }
        });
    </script>
</body>
</html>
