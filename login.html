<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal Login - Truck Dispatch Master Class</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="plan-selection-page">

    <!-- AUTH MAIN CONTAINER -->
    <main class="plan-main">
        <div class="verify-container" style="max-width: 520px;">
            
            <div class="verify-eyebrow">
                🔐 ROUTECRAFT SECURE ACCESS
            </div>
            
            <h1 class="verify-title" style="font-size: 32px; margin-bottom: 10px;">Log in to Your Portal</h1>
            <p class="verify-subtitle" style="margin-bottom: 28px;">
                Enter your credentials to access your course hub and dashboard.
            </p>

            <!-- LOGIN FORM CARD -->
            <div class="search-card" style="text-align: left; padding: 32px;">
                <form id="login-form">
                    
                    <!-- Email Field -->
                    <div style="margin-bottom: 18px;">
                        <label for="login-email" style="display: block; font-size: 13.5px; font-weight: 700; color: #0f172a; margin-bottom: 6px;">Email Address</label>
                        <input type="email" id="login-email" placeholder="Enter your email" required style="width: 100%; background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px; padding: 14px 18px; font-size: 15px; color: #0f172a; outline: none;">
                    </div>

                    <!-- Password Field -->
                    <div style="margin-bottom: 24px;">
                        <label for="login-password" style="display: block; font-size: 13.5px; font-weight: 700; color: #0f172a; margin-bottom: 6px;">Password</label>
                        <input type="password" id="login-password" placeholder="Enter your password" required style="width: 100%; background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px; padding: 14px 18px; font-size: 15px; color: #0f172a; outline: none;">
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" style="width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer;">
                        Log In →
                    </button>

                </form>

                <div style="text-align: center; margin-top: 20px; font-size: 13.5px; color: #64748b;">
                    Don't have an account? <a href="signup.html" style="color: #2563eb; font-weight: 700; text-decoration: none;">Sign up</a>
                </div>
            </div>

        </div>
    </main>

    <!-- SUPABASE SDK & CONFIG -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>

    <!-- SUPABASE LOGIN SCRIPT -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const loginForm = document.getElementById("login-form");

            if (loginForm) {
                loginForm.addEventListener("submit", async function (event) {
                    event.preventDefault(); // Prevents page reload

                    const enteredEmail = document.getElementById("login-email").value.trim();
                    const enteredPassword = document.getElementById("login-password").value;

                    // Verify Supabase client is loaded
                    if (typeof supabaseClient === 'undefined') {
                        alert("System Error: Supabase client is not loaded.");
                        return;
                    }

                    // Authenticate directly with Supabase Auth
                    const { data, error } = await supabaseClient.auth.signInWithPassword({
                        email: enteredEmail,
                        password: enteredPassword
                    });

                    if (error) {
                        alert("Login Error: " + error.message);
                        console.error("Login failed:", error.message);
                        return;
                    }

                    // Success! Active session created in Supabase -> Redirect to dashboard
                    window.location.href = "free/dashboard.html"; 
                });
            }
        });
    </script>
</body>
</html>
