<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal Login - Truck Dispatch Master Class</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="plan-selection-page">

    <!-- AUTH MAIN CONTAINER -->
    <main class="plan-main">
        <div class="verify-container" style="max-width: 520px;">
            
            <div class="verify-eyebrow">
                🔐 ROUTECRAFT SECURE ACCESS
            </div>
            
            <h1 class="verify-title" style="font-size: 32px; margin-bottom: 10px;">Log in to Your Portal</h1>
            <p class="verify-subtitle" style="margin-bottom: 28px;">
                Enter your credentials to access your course hub and dashboard.
            </p>

            <!-- LOGIN FORM CARD -->
            <div class="search-card" style="text-align: left; padding: 32px;">
                <form id="login-form">
                    
                    <!-- Email Field -->
                    <div style="margin-bottom: 18px;">
                        <label for="login-email" style="display: block; font-size: 13.5px; font-weight: 700; color: #0f172a; margin-bottom: 6px;">Email Address</label>
                        <input type="email" id="login-email" placeholder="Enter your email" required style="width: 100%; background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px; padding: 14px 18px; font-size: 15px; color: #0f172a; outline: none;">
                    </div>

                  <!-- Login Password Field -->
<div style="margin-bottom: 24px;">
    <label for="password" style="display: block; font-size: 13.5px; font-weight: 700; color: #0f172a; margin-bottom: 6px;">Password</label>
    <div style="position: relative;">
        <input type="password" id="password" placeholder="••••••••••••" style="width: 100%; background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px; padding: 14px 45px 14px 18px; font-size: 15px; color: #0f172a; outline: none;">
        
        <!-- Toggle Button for Login Password -->
        <button type="button" id="toggle-btn-login" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 0; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; z-index: 10;">
            <svg id="eye-icon-login" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px; display: block; pointer-events: none;">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
        </button>
    </div>
    <small id="password-error" style="color: #ef4444; font-size: 12px; display: none; margin-top: 2px;"></small>
</div>

                    <!-- Submit Button -->
                    <button type="submit" style="width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer;">
                        Log In →
                    </button>

                </form>

                <div style="text-align: center; margin-top: 20px; font-size: 13.5px; color: #64748b;">
                    Don't have an account? <a href="signup.html" style="color: #2563eb; font-weight: 700; text-decoration: none;">Sign up</a>
                </div>
            </div>

        </div>
    </main>

    <!-- SUPABASE SDK & CONFIG -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>

    <!-- SUPABASE LOGIN SCRIPT -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const loginForm = document.getElementById("login-form");

            if (loginForm) {
                loginForm.addEventListener("submit", async function (event) {
                    event.preventDefault(); // Prevents page reload

                    const enteredEmail = document.getElementById("login-email").value.trim();
                    const enteredPassword = document.getElementById("password").value;

                    // Verify Supabase client is loaded
                    if (typeof supabaseClient === 'undefined') {
                        alert("System Error: Supabase client is not loaded.");
                        return;
                    }

                    // Authenticate directly with Supabase Auth
                    const { data, error } = await supabaseClient.auth.signInWithPassword({
                        email: enteredEmail,
                        password: enteredPassword
                    });

                    if (error) {
                        alert("Login Error: " + error.message);
                        console.error("Login failed:", error.message);
                        return;
                    }

                    // Success! Active session created in Supabase -> Redirect to dashboard
                    window.location.href = "free/dashboard.html"; 
                });
            }
        });
    </script>
    <script>
document.addEventListener("DOMContentLoaded", function() {
    const toggleBtn = document.getElementById('toggle-btn-login');
    const input = document.getElementById('password');
    const icon = document.getElementById('eye-icon-login');

    if (toggleBtn && input && icon) {
        toggleBtn.addEventListener('click', function() {
            if (input.type === 'password') {
                input.type = 'text';
                // Eye-slash (visible) icon
                icon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;
            } else {
                input.type = 'password';
                // Standard eye (hidden) icon
                icon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
            }
        });
    }
});
</script>
</body>
</html>
